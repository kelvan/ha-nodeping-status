name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_call:

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@v3
        with:
          args: check
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check

  ty:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Type check
        run: uvx ty check

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: HA ${{ matrix.ha-version }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow-failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha-version: "latest"
            python-version: "3.13"
            allow-failure: false
          - ha-version: "latest"
            python-version: "3.14"
            allow-failure: false
          - ha-version: "pre"
            python-version: "3.13"
            allow-failure: true
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false

      - name: Create venv
        run: uv venv

      - name: Install dependencies
        run: |
          if [ "${{ matrix.ha-version }}" = "latest" ]; then
            uv pip install homeassistant -r requirements_test.txt
          elif [ "${{ matrix.ha-version }}" = "pre" ]; then
            uv pip install --pre homeassistant -r requirements_test.txt
          else
            uv pip install "homeassistant==${{ matrix.ha-version }}" -r requirements_test.txt
          fi

      - name: Run tests
        run: uv run --no-project pytest tests/ -v
